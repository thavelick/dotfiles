<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TITLE</title>
<style>
  :root { --ink: #1a1d23; --muted: #5b6270; --line: #dfe3ea; --bg: #f7f8fa; --accent: #1d4f91; --warn-bg: #fff4e0; --warn-ink: #8a4b00; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { padding: 32px 40px 16px; max-width: 1280px; margin: 0 auto; }
  header h1 { margin: 0 0 8px; font-size: 28px; }
  header p { margin: 0; color: var(--muted); }
  header code, .path code, .note code, .oddities code { background: #e9edf3; padding: 1px 6px; border-radius: 4px; }
  nav.toc { position: sticky; top: 0; z-index: 10; background: #fff; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  nav.toc ol { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0 auto; padding: 10px 40px; max-width: 1280px; list-style: none; font-size: 14px; }
  nav.toc a { color: var(--accent); text-decoration: none; }
  nav.toc a:hover { text-decoration: underline; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 40px 80px; }
  section { margin: 0 0 56px; scroll-margin-top: 64px; }
  section h2 { font-size: 22px; margin: 0 0 8px; }
  section p { margin: 0 0 12px; max-width: 900px; }
  figure { margin: 16px 0 0; }
  figure + figure { margin-top: 24px; }
  .path { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  figure img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; display: block; }
  figure.crop img { max-width: 760px; }
  figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .note { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid #f2d59a; border-radius: 6px; padding: 10px 14px; max-width: 900px; }
  .oddities { max-width: 900px; padding-left: 24px; }
  .oddities li { margin-bottom: 10px; }
</style>
</head>
<body>
<header>
  <h1>TITLE</h1>
  <p>Captured DATE against <code>BASE_URL</code>. Viewport 1280×900. SETUP_SENTENCE</p>
</header>

<nav class="toc" aria-label="Screens">
  <ol>
    <li><a href="#s01">1 SHORT_NAME</a></li>
    <li><a href="#oddities">Oddities</a></li>
  </ol>
</nav>

<main>

<section id="s01">
  <h2>1. SCREEN_NAME</h2>
  <p>PARAGRAPH</p>
  <figure>
    <p class="path"><code>PATH</code></p>
    <img src="01-SLUG.png" alt="ALT">
    <figcaption>CAPTION</figcaption>
  </figure>
</section>

<section id="oddities">
  <h2>Screens not captured, and oddities noticed</h2>
  <p class="note">NOT_CAPTURED</p>
  <ol class="oddities">
    <li><strong>PROBLEM_IN_A_FEW_WORDS.</strong> ONE_OR_TWO_SENTENCES_THAT_STAND_ALONE</li>
  </ol>
</section>

</main>
</body>
</html>
