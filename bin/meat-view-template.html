<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><!--diff2html-title--></title>

    <!--
      Diff to HTML wrapper, customized for meat-view (bin/meat-view).
      Based on diff2html-cli's stock template.html by rtfpessoa.
      The diff2html-title / diff2html-css / diff2html-js-ui / diff2html-header /
      diff2html-diff comment placeholders and the //diff2html-* script lines are
      substituted by diff2html-cli; do not remove them. The meat-header and
      meat-footer comment placeholders are substituted by meat-view itself.
    -->

    <!--diff2html-css-->

    <!--diff2html-js-ui-->

    <style>
      :root {
        --meat-bg: #ffffff;
        --meat-fg: #1f2328;
        --meat-muted: #59636e;
        --meat-border: #d1d9e0;
        --meat-subtle: #f6f8fa;
        --meat-accent: #8250df;
        --meat-warn: #9a6700;
        --meat-warn-bg: #fff8c5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --meat-bg: #0d1117;
          --meat-fg: #e6edf3;
          --meat-muted: #9198a1;
          --meat-border: #3d444d;
          --meat-subtle: #151b23;
          --meat-accent: #d2a8ff;
          --meat-warn: #d29922;
          --meat-warn-bg: #272115;
        }
      }

      body {
        margin: 0;
        background: var(--meat-bg);
        color: var(--meat-fg);
      }

      /* The stock template centers everything; the diff must not be centered. */
      #diff {
        text-align: left;
      }

      /* ---- header band ------------------------------------------------- */

      .meat-band {
        text-align: left;
        padding: 18px 20px 14px;
        border-bottom: 1px solid var(--meat-border);
        background: var(--meat-subtle);
        font-size: 14px;
        line-height: 1.5;
      }
      .meat-band-inner {
        max-width: 105ch;
      }
      .meat-eyebrow {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .meat-tag {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--meat-accent);
        border: 1px solid currentColor;
        border-radius: 999px;
        padding: 2px 8px;
        white-space: nowrap;
      }
      .meat-band h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
        color: var(--meat-muted);
      }
      .meat-summary {
        margin: 0 0 10px;
        font-size: 17px;
        line-height: 1.45;
      }
      .meat-summary code,
      .meat-note code {
        font-size: 0.88em;
        background: var(--meat-bg);
        border: 1px solid var(--meat-border);
        border-radius: 4px;
        padding: 0 4px;
      }
      .meat-facts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 4px;
      }
      .meat-chip {
        font-size: 12px;
        color: var(--meat-muted);
        background: var(--meat-bg);
        border: 1px solid var(--meat-border);
        border-radius: 999px;
        padding: 2px 10px;
      }
      .meat-chip-link {
        color: var(--meat-accent);
        border-color: var(--meat-accent);
        text-decoration: none;
        font-weight: 600;
      }
      .meat-chip-link:hover {
        background: var(--meat-subtle);
      }
      .meat-chip-warn {
        color: var(--meat-warn);
        background: var(--meat-warn-bg);
        border-color: var(--meat-warn);
      }
      .meat-note {
        margin: 10px 0 0;
        padding-left: 10px;
        border-left: 3px solid var(--meat-border);
        color: var(--meat-fg);
      }
      .meat-note p {
        margin: 0 0 8px;
      }
      .meat-note p:last-child {
        margin-bottom: 0;
      }
      .meat-details {
        margin-top: 8px;
      }
      .meat-details > summary {
        cursor: pointer;
        font-size: 13px;
        color: var(--meat-muted);
        list-style-position: outside;
      }
      .meat-details > summary:hover {
        color: var(--meat-fg);
      }
      .meat-details ul {
        margin: 6px 0 0;
        padding-left: 26px;
        font-size: 13px;
        color: var(--meat-muted);
      }
      .meat-details li {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
      .meat-details pre {
        margin: 6px 0 0 16px;
        font-size: 12px;
        white-space: pre-wrap;
        color: var(--meat-muted);
      }

      /* ---- sticky file list -------------------------------------------- */

      .d2h-file-list-wrapper {
        position: sticky;
        top: 0;
        z-index: 10;
        background: #fff;
        max-height: 40vh;
        overflow: auto;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        text-align: left;
        margin-bottom: 0;
        padding: 10px 20px;
      }
      @media (prefers-color-scheme: dark) {
        .d2h-file-list-wrapper {
          background: #0d1117;
          box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }
      }
      .d2h-wrapper {
        padding: 16px 20px 60px;
      }

      /* ---- sticky per-file header --------------------------------------
         diff2html's own rule pins it at top: 0, which puts it under the
         sticky file list. --meat-listh is that list's live height, set by
         the ResizeObserver below; the fallback matters only pre-script. */
      .d2h-file-wrapper .d2h-sticky-header {
        top: var(--meat-listh, 0px);
      }

      /* ---- merge footer ------------------------------------------------- */

      .meat-footer {
        text-align: left;
        margin: 0 20px 60px;
        padding: 14px 16px;
        border: 1px solid var(--meat-border);
        border-radius: 6px;
        background: var(--meat-subtle);
        font-size: 14px;
      }
      .meat-footer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .meat-footer h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .meat-footer p {
        margin: 6px 0 10px;
        color: var(--meat-muted);
      }
      .meat-footer pre {
        margin: 0;
        padding: 10px 12px;
        overflow-x: auto;
        border: 1px solid var(--meat-border);
        border-radius: 4px;
        background: var(--meat-bg);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
      .meat-copy {
        flex: none;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        color: var(--meat-fg);
        background: var(--meat-bg);
        border: 1px solid var(--meat-border);
        border-radius: 6px;
        padding: 4px 12px;
      }
      .meat-copy:hover {
        border-color: var(--meat-accent);
        color: var(--meat-accent);
      }

      /* ---- hidden line numbers ------------------------------------------
         meat's folds make in-hunk line numbers wrong, so they are not shown.
         The gutter itself stays: it is what separates the two sides, and it
         now carries the per-line dot that marks where a logical line starts
         (see the wrapping block below). */
      /* !important because diff2html's dark rules are
         `.d2h-auto-color-scheme .d2h-code-side-linenumber`, which outranks a
         bare class selector — without it the numbers reappear in dark mode. */
      .d2h-code-side-linenumber,
      .d2h-code-linenumber {
        color: transparent !important;
      }

      /* ---- wrapped lines -------------------------------------------------
         diff2html sets `white-space: pre` on the code cells and gives each
         side its own horizontal scrollbar, so one long line pushes the rest
         of that side off screen and the two halves scroll apart. A reading
         diff is for reading: wrap instead. `anywhere` rather than
         `break-word` because code has few break opportunities — a minified
         line or a long URL would otherwise still overflow.

         The container keeps `white-space: normal`: diff2html pretty-prints
         the markup, so the newlines and indentation between the prefix and
         content spans are real characters that `pre-wrap` would render,
         putting every +/- on a line of its own. Only the spans that hold
         code preserve their whitespace. */
      .d2h-code-line,
      .d2h-code-side-line {
        display: block;
        width: auto;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      /* `hidden`, not `auto`: each side reserves a scrollbar, and the table
         inside sizes to 100% of the padding box while the scrollbar eats the
         client box — so the bar keeps itself alive by 15px forever. Nothing
         overflows sideways once lines wrap, so there is nothing to scroll
         to. */
      .d2h-file-side-diff,
      .d2h-file-diff {
        overflow-x: hidden;
      }
      /* The line content is an inline-block at `width: 100%`, which wraps as
         one unit below the +/- prefix instead of letting its text flow; the
         del/ins highlight spans are inline-blocks too, and an inline-block
         never breaks internally, so the longest runs would not wrap at all.

         `overflow-wrap` is inherited, but diff2html sets `word-wrap: normal`
         (its alias) on the content span, which both blocks breaking and,
         because an unbreakable cell sets a table's min-content width, keeps
         the whole table wider than its column. */
      .d2h-code-line-ctn,
      .d2h-code-line-prefix {
        display: inline;
        width: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .d2h-code-line del,
      .d2h-code-line ins,
      .d2h-code-side-line del,
      .d2h-code-side-line ins {
        display: inline;
      }
      /* Hanging indent: continuation rows sit 2ch in so a wrapped line reads
         as one line rather than as two statements. The negative text-indent
         pulls the first row — prefix span included — back flush, so the extra
         padding shows up only on the rows after it. */
      .d2h-code-side-line {
        padding-left: calc(4.5em + 2ch);
        text-indent: -2ch;
      }
      .d2h-code-line {
        padding-left: calc(8em + 2ch);
        text-indent: -2ch;
      }
      /* With the numbers hidden and lines wrapping, nothing said where one
         logical line ended and the next began. This dot does: one per line,
         floated to the top-left of the gutter cell, which stays one row tall
         even when its line wraps. Skipped on hunk headers and on the blank
         placeholders that pad one side against the other, which are not
         lines. Declaring the color here beats the `transparent` the cell
         inherits without needing !important. */
      .d2h-code-side-linenumber:not(.d2h-info):not(.d2h-code-side-emptyplaceholder)::before,
      .d2h-code-linenumber:not(.d2h-info):not(.d2h-emptyplaceholder)::before {
        content: '·';
        float: left;
        color: var(--meat-muted);
        opacity: 0.55;
      }
    </style>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const targetElement = document.getElementById('diff');
        const diff2htmlUi = new Diff2HtmlUI(targetElement);
        //diff2html-fileListToggle
        //diff2html-fileContentToggle
        //diff2html-synchronisedScroll
        //diff2html-highlightCode
        // Not a diff2html-cli placeholder — the CLI has no flag for it, but the
        // UI bundle does, and it is what keeps each file's name and its Viewed
        // checkbox on screen while you scroll that file.
        diff2htmlUi.stickyFileHeaders();

        // Browsers restore checkbox state across a reload, but the collapse
        // those boxes drive is runtime-only — so a refresh would show every
        // file expanded with its Viewed box still ticked. Start clean. The
        // pageshow pass covers the back/forward cache, which restores the
        // whole page without firing DOMContentLoaded again.
        const clearViewed = () =>
          document
            .querySelectorAll('.d2h-file-collapse-input')
            .forEach((box) => (box.checked = false));
        clearViewed();
        window.addEventListener('pageshow', clearViewed);

        // The file list is itself sticky and its height changes when it is
        // toggled open, so the per-file headers have to stack below whatever
        // it currently is, not below a guess.
        const fileList = document.querySelector('.d2h-file-list-wrapper');
        if (fileList) {
          const track = () =>
            document.documentElement.style.setProperty(
              '--meat-listh',
              fileList.offsetHeight + 'px',
            );
          new ResizeObserver(track).observe(fileList);
          track();
        }

        // Side-by-side mode renders the two halves of a file as two separate
        // tables, so nothing makes row n on the left as tall as row n on the
        // right. Once lines wrap that matters: one wrapped line on one side
        // shifts every row below it out of step with its counterpart. Pair
        // the rows up by index and give both the taller of the two.
        const syncRowHeights = () => {
          document.querySelectorAll('.d2h-files-diff').forEach((pair) => {
            // A collapsed ("Viewed") file measures zero; pinning rows to 0px
            // would leave it broken when it is expanded again. The change
            // handler below re-syncs it then.
            if (!pair.offsetParent) return;
            const sides = pair.querySelectorAll(':scope > .d2h-file-side-diff');
            if (sides.length !== 2) return;
            const rows = [...sides].map((side) =>
              side.querySelectorAll('tbody.d2h-diff-tbody > tr'),
            );
            const count = Math.min(rows[0].length, rows[1].length);
            // Three passes, not one: a height written to one row invalidates
            // layout for every row after it, so clear them all, then measure
            // them all, then write. Interleaving would measure stale rows.
            for (let i = 0; i < count; i++) {
              rows[0][i].style.height = '';
              rows[1][i].style.height = '';
            }
            const heights = [];
            for (let i = 0; i < count; i++) {
              heights.push(Math.max(rows[0][i].offsetHeight, rows[1][i].offsetHeight));
            }
            for (let i = 0; i < count; i++) {
              rows[0][i].style.height = heights[i] + 'px';
              rows[1][i].style.height = heights[i] + 'px';
            }
          });
        };
        syncRowHeights();
        // Wrapping depends on the width, and highlighting and webfonts can
        // both land after DOMContentLoaded and change how much fits per row.
        window.addEventListener('load', syncRowHeights);
        let resizeTimer;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(syncRowHeights, 120);
        });

        // Checking a file's Viewed box collapses it, and everything below
        // jumps up by the height of what just vanished — so you land mid-hunk
        // in the next file with its opening lines already scrolled past.
        // Re-anchor on the file you just folded, under the sticky file list,
        // so the next one starts at the top of the frame. Delegated because
        // stickyFileHeaders may re-render the headers these boxes live in.
        document.addEventListener('change', (event) => {
          const box = event.target.closest?.('.d2h-file-collapse-input');
          if (!box) return;
          // Expanding a file reveals rows that were unmeasurable while it was
          // collapsed, so they only get their heights now.
          requestAnimationFrame(syncRowHeights);
          if (!box.checked) return;
          const wrapper = box.closest('.d2h-file-wrapper');
          if (!wrapper) return;
          // Next frame, so the position measured is the post-collapse one:
          // diff2html's own change handler runs on this same event.
          requestAnimationFrame(() => {
            const listHeight = fileList ? fileList.offsetHeight : 0;
            window.scrollTo({
              top: window.scrollY + wrapper.getBoundingClientRect().top - listHeight,
              // Instant, not smooth: the collapse and the scroll animating at
              // once makes it hard to see which file you just folded.
              behavior: 'instant',
            });
          });
        });

        document.querySelectorAll('.meat-copy').forEach((button) => {
          button.addEventListener('click', async () => {
            const text = button.dataset.copy;
            try {
              await navigator.clipboard.writeText(text);
              button.textContent = 'Copied';
            } catch {
              // file:// pages are a secure context in current browsers, so this
              // is the rare-permission case: leave the text selectable and say so.
              button.textContent = 'Copy failed — select it';
            }
            setTimeout(() => (button.textContent = 'Copy to clipboard'), 2000);
          });
        });
      });
    </script>
  </head>
  <body style="text-align: center; font-family: 'Source Sans Pro', sans-serif">
    <header class="meat-band">
      <div class="meat-band-inner">
        <div class="meat-eyebrow">
          <span class="meat-tag">reading diff</span>
          <h1><!--diff2html-header--></h1>
        </div>
        <!--meat-header-->
      </div>
    </header>

    <div id="diff">
      <!--diff2html-diff-->
    </div>

    <!--meat-footer-->
  </body>
</html>
